# demo/ を GitHub Pages へ出す。ビルドは無い（ブラウザが index.js をそのまま読む）。
# ただし **テストが通らなければ公開しない** — 壊れたデモを出すのは、無いより悪い。
name: pages
on:
  push: { branches: [main] }
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - name: テスト（依存ゼロなので install は無い）
        run: npm test
      - name: 公開するものを集める
        run: |
          mkdir -p _site
          cp -r demo/* _site/
          # デモは ../index.js を読むので、ライブラリ本体も置く
          cp index.js index3d.js _site/
          cp -r integration _site/
          sed -i "s|from '../index.js'|from './index.js'|; s|from '../index3d.js'|from './index3d.js'|" _site/demo.js
          rm -f _site/smoke.mjs
      - uses: actions/upload-pages-artifact@v3
        with: { path: _site }
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
